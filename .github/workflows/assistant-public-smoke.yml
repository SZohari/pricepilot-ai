name: Public assistant smoke check

# Explicitly tests the deployed demo, not the checkout's application version.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/assistant-public-smoke.yml

permissions:
  contents: read

jobs:
  verify-live-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install httpx==0.28.1
      - name: Require real answers for both fictional-shop questions
        run: python -m scripts.verify_assistant --url https://sepas.eu.pythonanywhere.com --require-generation
